# OpenSpec Configuration
schema: 1

project:
  name: almotacen
  repository: cesarchavezcal/almotacen
  type: application
  description: Reactive cash flow manager and proactive zero-based budgeting tool combining Monarch Money and YNAB.
  stack:
    language: typescript
    frameworks:
      - expo
      - expo-router
      - react-native
      - react
      - supabase
    package_manager: npm
    build_tool: metro

testing:
  runner: vitest
  framework: jest-expo
  layers:
    - unit
    - integration
  coverage_tool: null
  strict_tdd: true
  command: npm test

quality:
  linter: gga
  linter_config: .gga
  formatter: prettier
  type_checker: tsc

conventions:
  git:
    branch_pattern: "{prefix}/CCH/{project-initials}-{ticket-number}-{ticket-summary}"
    commit_pattern: "<prefix>(<scope>): <summary>"
    pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
  pipeline:
    explore:
      command: "/product-function"
      secondary: "/grill-with-docs"
    spec:
      command: "/to-spec"
    design:
      command: "/information-architecture"
      secondary: "/ooux"
    tasks:
      command: "/to-tickets"
    apply:
      executor: "/implement"
      worker: "/harness"
      swarm: "/team-cheap"
    verify:
      review: "/code-review"
      gate: ".gga"
    archive:
      command: "/sdd-archive"

skills:
  registry_path: ".atl/skill-registry.md"
  lockfile_path: "skills-lock.json"
  count: 43
  global_count: 25
  total_ecosystem_count: 68

persistence:
  mode: openspec
