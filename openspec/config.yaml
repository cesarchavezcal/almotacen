# OpenSpec Configuration
schema: 1

project:
  name: almotacen
  repository: cesarchavezcal/almotacen
  type: application
  description: Reactive cash flow manager and proactive zero-based budgeting tool combining Monarch Money and YNAB.
  stack:
    language: typescript
    frameworks:
      - expo
      - expo-router
      - react-native
      - react
      - supabase
    package_manager: npm
    build_tool: metro

testing:
  runner: vitest
  framework: jest-expo
  layers:
    - unit
    - integration
  coverage_tool: null
  strict_tdd: true
  command: npm test

quality:
  linter: gga
  linter_config: .gga
  formatter: prettier
  type_checker: tsc

conventions:
  git:
    branch_pattern: "{prefix}/CCH/{project-initials}-{ticket-number}-{ticket-summary}"
    commit_pattern: "<prefix>(<scope>): <summary>"
    pr_template: ".github/PULL_REQUEST_TEMPLATE.md"
  pipeline:
    explore:
      command: "/product-function"
      secondary: "/grill-with-docs"
      skills:
        - product-function
        - grill-with-docs
        - domain-modeling
    spec:
      command: "/to-spec"
      secondary: "/spec-to-tests"
      skills:
        - to-spec
        - unslop
        - spec-to-tests
    design:
      command: "/information-architecture"
      secondary: "/ooux"
      skills:
        - information-architecture-review
        - ooux
        - expo-project-structure
        - expo-design-system
        - expo-native-ui
        - expo-ui
        - supabase-postgres-best-practices
    tasks:
      command: "/to-tickets"
      skills:
        - to-tickets
    apply:
      executor: "/implement"
      worker: "/harness"
      swarm: "/team-cheap"
      skills:
        - expo-router
        - expo-ui
        - expo-native-ui
        - expo-animation
        - expo-data-fetching
        - expo-dom
        - expo-module
        - expo-app-clip
        - supabase-postgres-best-practices
        - supabase
        - tdd
        - react-native-testing
    verify:
      review: "/code-review"
      gate: ".gga"
      skills:
        - code-review
        - react-native-testing
        - unslop
    archive:
      command: "/sdd-archive"
      skills:
        - sdd-archive
        - eas-hosting
        - eas-workflows
        - expo-upgrade

skills:
  registry_path: ".atl/skill-registry.md"
  lockfile_path: "skills-lock.json"
  count: 64
  global_count: 25
  total_ecosystem_count: 89

persistence:
  mode: openspec
